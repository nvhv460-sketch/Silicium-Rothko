#
# Redmi Turbo 4 (Rodin), MT6899 (Dimensity 8400-Ultra).
# First-boot configuration: the UEFI FD load address is inherited from rothko
# (same MTK generation); it must be confirmed against rodin's LK on the first
# bounded boot and adjusted from its handoff log.
#
tool_chain_tag = "CLANGDWARF"

[uefi_fd]
base = 0x40400000
size = 0x200000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

[boot_image]
header_version = 4

[boot_shim]
requires_kernel_header = true
